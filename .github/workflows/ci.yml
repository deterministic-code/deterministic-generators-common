name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deterministic-code/deterministic-specifications
          path: deterministic-specifications
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix typescript/parser
      - run: npm ci --prefix typescript/validator
      - run: npm test --prefix typescript

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deterministic-code/deterministic-specifications
          path: deterministic-specifications
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with 100% coverage
        working-directory: rust
        run: cargo llvm-cov --fail-under-lines 100 --fail-under-functions 100 --ignore-filename-regex '(samples_test|parity_test|semantics_parity)\.rs'

  csharp:
    name: csharp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: deterministic-code/deterministic-specifications
          path: deterministic-specifications
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test with 100% coverage
        working-directory: csharp
        run: dotnet test Deterministic.Generators.Common.slnx --collect:"XPlat Code Coverage" --results-directory ./coverage --settings coverlet.runsettings
